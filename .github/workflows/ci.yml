name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognipath
          POSTGRES_PASSWORD: cognipath
          POSTGRES_DB: cognipath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognipath -d cognipath"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cognipath:cognipath@localhost:5432/cognipath
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          for f in agents/*/requirements.txt; do if [ -f "$f" ]; then pip install -r "$f"; fi; done
      - name: Lint
        run: ruff check shared agents tests
      - name: Test
        # exit code 5 = no tests collected yet; treat as success
        run: pytest || [ $? -eq 5 ]
