name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          for f in agents/*/requirements.txt; do if [ -f "$f" ]; then pip install -r "$f"; fi; done
      - name: Lint
        run: ruff check shared agents tests
      - name: Test
        # exit code 5 = no tests collected yet; treat as success
        run: pytest || [ $? -eq 5 ]
